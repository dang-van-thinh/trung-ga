<body>

    <!-- Scroll Progress Bar -->
    <div id="scrollProgress" class="scroll-progress-bar"></div>

    <div id="customAlert" class="custom-alert">
        <div class="alert-content">
            <div class="alert-avatar">🛒</div>
            <div class="alert-body">
                <div class="alert-row-top">
                    <div class="alert-name-wrap">
                        <span class="alert-live-dot"></span>
                        <span class="alert-customer" id="customerName"></span>
                    </div>
                    <span class="alert-close" onclick="App.closeCustomerAlert()">×</span>
                </div>
                <div class="alert-meta" id="alertMeta"></div>
                <div class="alert-product" id="productName"></div>
                <div class="alert-time" id="alertTime">🕐 vài giây trước</div>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Đặt Hàng Ngay</h2>
                <button class="close-btn" onclick="App.closeOrderModal()">×</button>
            </div>
            <form id="orderForm" onsubmit="App.submitOrder(event)" novalidate>
                <input type="hidden" id="productSelect">

                <div class="form-group product-options">
                    <label>Chọn Sản Phẩm *</label>
                    <div id="productRadioGrid" class="product-radio-grid">
                        <!-- Rendered by components.js -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="quantity">Số Lượng *</label>
                    <div class="quantity-stepper">
                        <button type="button" class="quantity-btn" aria-label="Giảm số lượng"
                            onclick="App.changeQuantity(-1)">−</button>
                        <input type="number" id="quantity" min="1" value="1" required>
                        <button type="button" class="quantity-btn" aria-label="Tăng số lượng"
                            onclick="App.changeQuantity(1)">+</button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Họ Tên *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Số Điện Thoại *</label>
                        <input type="tel" id="phone" inputmode="tel" placeholder="VD: 0912345678" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="province">Tỉnh/Thành Phố *</label>
                    <div class="searchable-select" data-target="province">
                        <button type="button" class="searchable-select-trigger">
                            <span class="searchable-select-label">-- Chọn Tỉnh/Thành Phố --</span>
                            <span class="searchable-select-arrow">▼</span>
                        </button>
                        <div class="searchable-select-dropdown">
                            <input type="text" class="searchable-select-input" placeholder="Tìm tỉnh/thành phố">
                            <div class="searchable-select-options"></div>
                            <div class="searchable-select-empty">Không tìm thấy kết quả phù hợp</div>
                        </div>
                    </div>
                    <select id="province" required onchange="App.updateDistricts()" class="native-select-hidden">
                        <option value="">-- Chọn Tỉnh/Thành Phố --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="district">Quận/Huyện *</label>
                    <div class="searchable-select is-disabled" data-target="district">
                        <button type="button" class="searchable-select-trigger" disabled>
                            <span class="searchable-select-label">-- Chọn Quận/Huyện --</span>
                            <span class="searchable-select-arrow">▼</span>
                        </button>
                        <div class="searchable-select-dropdown">
                            <input type="text" class="searchable-select-input" placeholder="Tìm quận/huyện" disabled>
                            <div class="searchable-select-options"></div>
                            <div class="searchable-select-empty">Không tìm thấy kết quả phù hợp</div>
                        </div>
                    </div>
                    <select id="district" required onchange="App.updateWards()" disabled class="native-select-hidden">
                        <option value="">-- Chọn Quận/Huyện --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ward">Phường/Xã *</label>
                    <div class="searchable-select is-disabled" data-target="ward">
                        <button type="button" class="searchable-select-trigger" disabled>
                            <span class="searchable-select-label">-- Chọn Phường/Xã --</span>
                            <span class="searchable-select-arrow">▼</span>
                        </button>
                        <div class="searchable-select-dropdown">
                            <input type="text" class="searchable-select-input" placeholder="Tìm phường/xã" disabled>
                            <div class="searchable-select-options"></div>
                            <div class="searchable-select-empty">Không tìm thấy kết quả phù hợp</div>
                        </div>
                    </div>
                    <select id="ward" required disabled class="native-select-hidden">
                        <option value="">-- Chọn Phường/Xã --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Địa Chỉ Chi Tiết *</label>
                    <input type="text" id="address" placeholder="VD: 123 Đường ABC, Số nhà..." required>
                </div>

                <div class="form-group">
                    <label for="note">Ghi Chú Đơn Hàng</label>
                    <textarea id="note" rows="3" placeholder="Ghi chú thêm cho đơn hàng (nếu có)"></textarea>
                </div>

                <div class="order-summary-box">
                    <div class="order-summary-row">
                        <span>Sản phẩm:</span>
                        <strong id="summaryProduct">—</strong>
                    </div>
                    <div class="order-summary-row">
                        <span>Số lượng:</span>
                        <strong id="summaryQuantity">1</strong>
                    </div>
                    <div class="order-summary-row order-summary-total">
                        <span>Tổng Tiền:</span>
                        <span id="totalPrice"
                            style="color: var(--accent); font-size: 18px; font-weight: bold;">0đ</span>
                    </div>
                </div>

                <div id="shippingNotice"
                    style="display:none; background: #fff8e1; border: 1px solid #f9a825; border-radius: 5px; padding: 10px 14px; margin-bottom: 20px; font-size: 14px; color: #5d4037;">
                    🚚 <span id="shippingNoticeText"></span>
                </div>

                <button type="submit" class="submit-btn">HOÀN TẤT ĐẶT HÀNG</button>
            </form>
        </div>
    </div>

    <!-- Result Modal (success / error / validation) -->
    <div id="resultModal" class="modal">
        <div class="modal-content result-modal-content">
            <button class="close-btn result-modal-close" onclick="App.closeResultModal()">×</button>
            <div class="result-modal-icon" id="resultModalIcon">✅</div>
            <h3 id="resultModalTitle">Đặt hàng thành công!</h3>
            <p id="resultModalMessage"></p>
            <button type="button" class="submit-btn" onclick="App.closeResultModal()">Đã hiểu</button>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <div class="scroll-top" id="scrollTop" onclick="App.scrollToTop()">
        <i class="fas fa-arrow-up"></i>
    </div>

    <!-- Load JS theo thứ tự: Data -> Components -> Location -> Main -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/location.js"></script>
    <script src="js/main.js"></script>

    <!-- Meta Pixel - CTA & Messenger Click Tracking -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('click', (e) => {
                if (typeof fbq === 'undefined') return;

                // 9 nút "Đặt hàng": header-btn, cta-btn (x3), featured-product-btn,
                // product-btn (x2), special-cta-button, final-cta-btn
                // Dùng event delegation vì các nút được Components.init() render
                // động sau khi loadLocations() resolve (js/main.js:536)
                if (e.target.closest('[onclick*="openOrderModal"]')) {
                    fbq('track', 'InitiateCheckout');
                }

                // Link Messenger (faq-messenger-btn)
                if (e.target.closest('a[href*="m.me"], a[href*="messenger.com"]')) {
                    fbq('track', 'Contact');
                }
            });
        });
    </script>
    <!-- End Meta Pixel - CTA & Messenger Click Tracking -->
</body>
