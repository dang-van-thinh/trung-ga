<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Trứng Gà Thảo Dược Sadu - Dinh Dưỡng Vàng Cho Mẹ Và Bé. 100% thảo dược tự nhiên, 0% kháng sinh tồn dư, cholesterol thấp.">
    <meta name="keywords" content="trứng gà, thảo dược, sadu, trứng sạch, dinh dưỡng, mẹ bầu">
    <meta name="author" content="Sadu">
    <title>Trứng Gà Thảo Dược Sadu - Dinh Dưỡng Vàng Cho Mẹ Và Bé</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" href="source/yolk.jpg" type="image/png">

    <!-- Meta Pixel Code -->

</head>

<body>

    <div id="customAlert" class="custom-alert">
        <div class="alert-content">
            <span class="alert-icon">✓</span>
            <div class="alert-text">
                <div class="alert-customer" id="customerName"></div>
                <div class="alert-product" id="productName"></div>
            </div>
            <span class="alert-close" onclick="App.closeCustomerAlert()">×</span>
        </div>
    </div>
    <!-- 3D Animated Background -->
    <div class="background-3d-container" id="background3d">
        <!-- Circle shapes -->
        <div class="floating-shape shape-circle shape-lg pos-1 animation-slow shape-glow"></div>
        <div class="floating-shape shape-circle shape-md pos-6 animation-medium"></div>

        <!-- Ring shapes -->
        <div class="floating-shape shape-ring shape-xl pos-2 animation-fast shape-glow-accent"></div>
        <div class="floating-shape shape-ring shape-sm pos-9 animation-slow"></div>

        <!-- Square shapes -->
        <div class="floating-shape shape-square shape-md pos-3 animation-medium shape-glow"></div>
        <div class="floating-shape shape-square shape-lg pos-7 animation-fast"></div>

        <!-- Diamond shapes -->
        <div class="floating-shape shape-diamond shape-sm pos-4 animation-slow shape-glow-accent"></div>
        <div class="floating-shape shape-diamond shape-md pos-8 animation-medium"></div>

        <!-- Additional shapes -->
        <div class="floating-shape shape-circle shape-sm pos-5 animation-fast"></div>
        <div class="floating-shape shape-ring shape-md pos-10 animation-slow shape-glow"></div>
        <div class="floating-shape shape-square shape-xs pos-11 animation-medium"></div>
        <div class="floating-shape shape-diamond shape-lg pos-12 animation-fast shape-glow-accent"></div>
    </div>

    <!-- Header -->
    <header id="header"></header>

    <!-- Hero Section -->
    <section id="hero" class="hero"></section>

    <!-- Benefits Section -->
    <section id="benefits" class="benefits"></section>

    <!-- Herbal Story Section -->
    <section id="herbal-story" class="herbal-story-section"></section>

    <!-- Farm Story Section -->
    <section id="farm-story" class="farm-story-section"></section>

    <!-- Why Section -->
    <section id="why" class="why-section"></section>

    <!-- Packaging & Shipping Section -->
    <section id="packaging" class="packaging-section"></section>


    <!-- Egg Comparison Section -->
    <section id="egg-comparison" class="egg-comparison"></section>

    <!-- Value Justification Section -->
    <section id="value-justification" class="value-justification-section"></section>

    <!-- Comparison Table -->
    <section id="comparison" class="comparison"></section>

    <!-- Statistics Section -->
    <section id="statistics" class="statistics-section"></section>

    <!-- Certificates Carousel -->
    <section id="certificates" class="comparison-image"></section>

    <!-- Special Program Section -->
    <section id="special-program" class="special-program-section"></section>

    <!-- Products Section -->
    <section id="products" class="products"></section>

    <!-- Gift Carousel Section -->
    <section id="gift-carousel" class="comparison-image"></section>

    <!-- Customer Feedback Gallery -->
    <section id="customer-feedback-gallery" class="customer-feedback-gallery"></section>

    <!-- FAQ Section -->
    <section id="faq" class="faq"></section>

    <!-- Final CTA Section -->
    <section id="final-cta" class="final-cta-section"></section>

    <!-- Footer -->
    <footer id="footer"></footer>

    <!-- Order Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Đặt Hàng Ngay</h2>
                <button class="close-btn" onclick="App.closeOrderModal()">×</button>
            </div>
            <form id="orderForm" onsubmit="App.submitOrder(event)">
                <input type="hidden" id="productSelect" required>

                <div class="form-group product-options">
                    <label>Chọn Sản Phẩm *</label>
                    <div id="productRadioGrid" class="product-radio-grid">
                        <!-- Rendered by components.js -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="quantity">Số Lượng *</label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Họ Tên *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Số Điện Thoại *</label>
                        <input type="tel" id="phone" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="province">Tỉnh/Thành Phố *</label>
                    <div class="searchable-select" data-target="province">
                        <button type="button" class="searchable-select-trigger">
                            <span class="searchable-select-label">-- Chọn Tỉnh/Thành Phố --</span>
                            <span class="searchable-select-arrow">▼</span>
                        </button>
                        <div class="searchable-select-dropdown">
                            <input type="text" class="searchable-select-input" placeholder="Tìm tỉnh/thành phố">
                            <div class="searchable-select-options"></div>
                            <div class="searchable-select-empty">Không tìm thấy kết quả phù hợp</div>
                        </div>
                    </div>
                    <select id="province" required onchange="App.updateDistricts()" class="native-select-hidden">
                        <option value="">-- Chọn Tỉnh/Thành Phố --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="district">Quận/Huyện *</label>
                    <div class="searchable-select is-disabled" data-target="district">
                        <button type="button" class="searchable-select-trigger" disabled>
                            <span class="searchable-select-label">-- Chọn Quận/Huyện --</span>
                            <span class="searchable-select-arrow">▼</span>
                        </button>
                        <div class="searchable-select-dropdown">
                            <input type="text" class="searchable-select-input" placeholder="Tìm quận/huyện" disabled>
                            <div class="searchable-select-options"></div>
                            <div class="searchable-select-empty">Không tìm thấy kết quả phù hợp</div>
                        </div>
                    </div>
                    <select id="district" required onchange="App.updateWards()" disabled class="native-select-hidden">
                        <option value="">-- Chọn Quận/Huyện --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ward">Phường/Xã *</label>
                    <div class="searchable-select is-disabled" data-target="ward">
                        <button type="button" class="searchable-select-trigger" disabled>
                            <span class="searchable-select-label">-- Chọn Phường/Xã --</span>
                            <span class="searchable-select-arrow">▼</span>
                        </button>
                        <div class="searchable-select-dropdown">
                            <input type="text" class="searchable-select-input" placeholder="Tìm phường/xã" disabled>
                            <div class="searchable-select-options"></div>
                            <div class="searchable-select-empty">Không tìm thấy kết quả phù hợp</div>
                        </div>
                    </div>
                    <select id="ward" required disabled class="native-select-hidden">
                        <option value="">-- Chọn Phường/Xã --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Địa Chỉ Chi Tiết *</label>
                    <input type="text" id="address" placeholder="VD: 123 Đường ABC, Số nhà..." required>
                </div>

                <div class="form-group">
                    <label for="note">Ghi Chú Đơn Hàng</label>
                    <textarea id="note" rows="3" placeholder="Ghi chú thêm cho đơn hàng (nếu có)"></textarea>
                </div>

                <div class="form-group"
                    style="background: var(--bg-light); padding: 15px; border-radius: 5px; margin-bottom: 20px;">
                    <strong>Tổng Tiền: </strong>
                    <span id="totalPrice" style="color: var(--accent); font-size: 18px; font-weight: bold;">0đ</span>
                </div>

                <button type="submit" class="submit-btn">HOÀN TẤT ĐẶT HÀNG</button>
            </form>
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <div class="scroll-top" id="scrollTop" onclick="App.scrollToTop()">
        <i class="fas fa-arrow-up"></i>
    </div>

    <!-- Load JS theo thứ tự: Data -> Components -> Location -> Main -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/location.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
